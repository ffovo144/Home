<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你的名字 · 个人主页</title>

<!-- ========= 修改处 1：把下面的名字/介绍/链接换成你自己的 ========= -->
<meta name="description" content="呆小方的个人主页">
<meta property="og:title" content="呆小方">
<meta property="og:description" content="呆小方的个人主页">

<!-- 网页标签上的小图标，改掉这行可以换成自己的图片文件 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23666cf0'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='system-ui'>Y</text></svg>">

<style>
  /* 主题色：想换配色只改这三个变量 */
  :root{
    --bg:#0e1014; --card:#171a21; --text:#e8eaef; --muted:#9aa3b2;
    --accent:#6f6cf3; --border:#262b36;
  }
  html[data-theme="light"]{
    --bg:#f7f8fa; --card:#ffffff; --text:#14171c; --muted:#5d6672;
    --accent:#4f46e5; --border:#e6e8ee;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased;
    transition:background .25s,color .25s;
  }
  .wrap{max-width:760px; margin:0 auto; padding:56px 22px 64px}

  /* 顶栏 */
  .top{display:flex; justify-content:flex-end; margin-bottom:8px}
  .theme-btn{
    background:transparent; color:var(--muted); border:1px solid var(--border);
    border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer;
  }
  .theme-btn:hover{color:var(--text); border-color:var(--accent)}

  /* 头像 + 名字 */
  .hero{display:flex; align-items:center; gap:22px; flex-wrap:wrap}
  .avatar{
    position:relative; width:96px; height:96px; border-radius:50%; flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),#3ec6c0);
    display:flex; align-items:center; justify-content:center;
    font-size:40px; font-weight:700; color:#fff; overflow:hidden;
    box-shadow:0 8px 30px rgba(111,108,243,.25);
  }
  /* 有头像图片时它会盖住上面的字母；没有图片自动回落到字母 */
  .avatar img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  h1{margin:0 0 4px; font-size:30px; letter-spacing:.3px}
  .tagline{margin:0; color:var(--muted); font-size:15px}

  /* 简介 */
  .bio{margin:26px 0 0; font-size:15.5px; color:var(--text); opacity:.92}
  .bio p{margin:0 0 10px}

  /* 主按钮 */
  .cta{
    display:inline-flex; align-items:center; gap:8px; margin-top:18px;
    background:var(--accent); color:#fff; text-decoration:none;
    padding:10px 20px; border-radius:999px; font-size:14.5px; font-weight:600;
    border:none; cursor:pointer;
  }
  .cta:hover{filter:brightness(1.08)}

  h2{
    font-size:13px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); margin:44px 0 14px; font-weight:600;
  }

  /* 链接卡片 */
  .links{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px}
  .link{
    display:flex; align-items:center; gap:12px; text-decoration:none;
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:14px 16px; color:var(--text); transition:transform .15s,border-color .15s;
  }
  .link:hover{transform:translateY(-2px); border-color:var(--accent)}
  .link .ico{font-size:19px; width:24px; text-align:center; flex:0 0 auto}
  .link .txt{min-width:0}
  .link .name{display:block; font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .link .sub{display:block; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  footer{margin-top:56px; padding-top:18px; border-top:1px solid var(--border); color:var(--muted); font-size:12.5px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}

  @media (max-width:520px){
    .wrap{padding:36px 18px 48px}
    .avatar{width:78px; height:78px; font-size:32px}
    h1{font-size:25px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <button class="theme-btn" id="themeBtn" type="button">切换主题</button>
  </div>

  <!-- ========= 修改处 2：头像、名字、一句话介绍 ========= -->
  <div class="hero">
    <div class="avatar">
      Y<!-- 没有头像图片时显示这个字母，改成你名字的首字母 -->
      <img src="avatar.jpg" alt="头像" onerror="this.remove()">
    </div>
    <div>
      <h1>呆小方</h1>
      <p class="tagline">测试test方方</p>
    </div>
  </div>

  <!-- ========= 修改处 3：简介段落，一行一段 ========= -->
  <div class="bio">
    <p>你好，我是「呆小方」。这里是放我常用链接的地方。</p>
    <p>平时喜欢折腾各种软件和旧设备，偶尔写点东西。</p>
  </div>

  <!-- ========= 修改处 4：邮箱按钮（改 mailto 后面的地址） ========= -->
  <a class="cta" href="mailto:chenfan53@amail.com">✉️ 给我发邮件</a>

  <!-- ========= 修改处 5：链接卡片 =========
       每个 .link 一个卡片：
       href 换成你的链接，emoji 换图标，.name 是大字，.sub 是下面的小字
       不需要的整段删掉即可 -->
  <h2>找到我</h2>
  <div class="links">

    <a class="link" href="https://github.com/ffovo144" target="_blank" rel="noopener">
      <span class="ico">🐙</span>
      <span class="txt"><span class="name">GitHub</span><span class="sub">@ffovo144</span></span>
    </a>

    <a class="link" href="https://b23.tv/rCEptQw" target="_blank" rel="noopener">
      <span class="ico">📺</span>
      <span class="txt"><span class="name">哔哩哔哩</span><span class="sub">看视频 / 投稿</span></span>
    </a>

    <a class="link" href="https://music.163.com/#/user/home?id=7865784012
" target="_blank" rel="noopener">
      <span class="ico">🎧</span>
      <span class="txt"><span class="name">网易云音乐</span><span class="sub">歌单</span></span>
    </a>

    <a class="link" href="https://store.steampowered.com/" target="_blank" rel="noopener">
      <span class="ico">🎮</span>
      <span class="txt"><span class="name">Steam</span><span class="sub">130234 / 在玩</span></span>
    </a>

    <a class="link" href="https://t.me/" target="_blank" rel="noopener">
      <span class="ico">💬</span>
      <span class="txt"><span class="name">Telegram</span><span class="sub">@用户名</span></span>
    </a>

    <a class="link" href="#" id="copyMail">
      <span class="ico">✉️</span>
      <span class="txt"><span class="name">复制邮箱</span><span class="sub" id="mailText">chenfan53@gmail.com</span></span>
    </a>

  </div>

  <footer>
    <span>© <span id="year">2026</span> 呆小方</span>
    <span></span>
  </footer>
</div>

<script>
  // 年份自动更新
  document.getElementById('year').textContent = new Date().getFullYear();

  // 主题切换（记住选择）
  var root = document.documentElement, btn = document.getElementById('themeBtn');
  var saved = localStorage.getItem('theme');
  if (saved) root.setAttribute('data-theme', saved);
  btn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });

  // 点“复制邮箱”
  var mail = 'chenfan53@gmail.com'; // ← 和上面 mailto 保持一致
  document.getElementById('mailText').textContent = mail;
  document.getElementById('copyMail').addEventListener('click', function (e) {
    e.preventDefault();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(mail).then(function () { alert('已复制：' + mail); });
    } else {
      alert(mail);
    }
  });
</script>
</body>
</html>
